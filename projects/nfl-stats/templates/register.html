{% extends "base.html" %}
{% block title %}Sign up · Family Fantasy{% endblock %}
{% block content %}
  <h1>Create your account</h1>
  <p class="sub">Pick a name your family will recognize.</p>
  <div class="card" style="max-width:420px">
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Name</label>
      <input name="username" autocomplete="username" placeholder="e.g. Hugo" required />
      <label>Password</label>
      <input name="password" type="password" autocomplete="new-password" placeholder="4+ characters" required />
      <button class="btn" type="submit">Sign up</button>
    </form>
    <p class="muted" style="margin-top:14px">Already have an account? <a href="/login">Log in</a></p>
  </div>
{% endblock %}
