<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Family Fantasy Football{% endblock %}</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0e1a; --surface:#111520; --surface2:#181f30; --border:#1e2840;
      --text-hi:#e8eaf6; --text-lo:#8b9ab8; --accent:#3b82f6; --accent2:#22c55e;
      --gold:#f5c451; --red:#ef4444;
      --radius:14px; --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text-hi);font-family:var(--font)}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .nav{display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--surface);
         border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
    .nav .brand{font-weight:800;font-size:18px;color:var(--text-hi);letter-spacing:.3px}
    .nav .brand span{color:var(--gold)}
    .nav .spacer{flex:1}
    .nav a.link{color:var(--text-lo);font-weight:600;font-size:14px}
    .nav a.link:hover{color:var(--text-hi);text-decoration:none}
    .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
    h1{font-size:28px;margin-bottom:6px}
    h2{font-size:20px;margin:26px 0 12px}
    p.sub{color:var(--text-lo);margin-bottom:22px}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
          padding:22px;margin-bottom:18px}
    .btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border:none;
         border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer}
    .btn:hover{filter:brightness(1.08);text-decoration:none}
    .btn.green{background:var(--accent2)}
    .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-hi)}
    .btn.small{padding:6px 12px;font-size:13px;border-radius:8px}
    input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;
          padding:11px 13px;color:var(--text-hi);font-size:15px;margin-bottom:12px}
    label{display:block;font-size:13px;color:var(--text-lo);margin-bottom:5px;font-weight:600}
    .error{background:rgba(239,68,68,.12);border:1px solid var(--red);color:#fca5a5;
           padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:15px}
    th{color:var(--text-lo);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
    .rank{font-weight:800;color:var(--gold);width:36px}
    .pts{font-weight:800;color:var(--accent2);text-align:right}
    .muted{color:var(--text-lo);font-size:13px}
    .pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);
          border-radius:999px;padding:2px 9px;font-size:11px;color:var(--text-lo);font-weight:700}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
    .leader{border:1px solid var(--gold)!important;box-shadow:0 0 0 1px rgba(245,196,81,.25)}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🏈 Family <span>Fantasy</span></a>
    <div class="spacer"></div>
    {% if user %}
      <a class="link" href="/dashboard">My Leagues</a>
      <a class="link" href="/stats">NFL Stats</a>
      <a class="link" href="/logout">Log out ({{ user['username'] }})</a>
    {% else %}
      <a class="link" href="/stats">NFL Stats</a>
      <a class="link" href="/login">Log in</a>
      <a class="btn small" href="/register">Sign up</a>
    {% endif %}
  </nav>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
