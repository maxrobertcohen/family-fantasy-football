<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hugo's Fantasy League{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    /* ============================================================
       Hugo's Fantasy League — bright, kid-friendly light theme
       Buffalo Bills identity: royal blue #00338D · red #C60C30
       ============================================================ */
    :root{
      --bg:#F2F6FC;            /* page: very light blue-white   */
      --surface:#FFFFFF;       /* cards                          */
      --surface2:#EAF0F9;      /* chips, input wells             */
      --border:#D4DFEF;        /* soft borders                   */
      --border-strong:#B9C8E0; /* inputs                         */
      --text-hi:#10214B;       /* near-navy body text            */
      --text-lo:#4A5B7D;       /* secondary text (AA on white)   */
      --bills-blue:#00338D;
      --bills-blue-dark:#00276B;
      --accent:#00338D;
      --accent2:#C60C30;       /* Bills red                      */
      --red:#C60C30;
      --gold:#A16207;          /* readable gold on light bg      */
      --gold-bg:#FFF6D9;
      --radius:18px;
      --shadow:0 2px 10px rgba(16,42,100,.08);
      --font:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    html,body{min-height:100%;background:var(--bg);color:var(--text-hi);
      font-family:var(--font);font-size:17px;line-height:1.55}
    a{color:var(--bills-blue);font-weight:700;text-decoration:none}
    a:hover{text-decoration:underline}

    /* ---- Top nav: Bills blue bar with red stripe ---- */
    .nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px;
         background:linear-gradient(180deg,var(--bills-blue) 0%,var(--bills-blue-dark) 100%);
         border-bottom:4px solid var(--red);position:sticky;top:0;z-index:10;
         box-shadow:0 2px 10px rgba(0,39,107,.25)}
    .nav .brand{font-weight:900;font-size:21px;color:#fff;letter-spacing:.2px}
    .nav .brand:hover{text-decoration:none}
    .nav .brand span{color:#FFD6DE}
    .nav .spacer{flex:1}
    .nav a.link{color:#fff;font-weight:800;font-size:16px;padding:6px 10px;border-radius:10px}
    .nav a.link:hover{background:rgba(255,255,255,.14);text-decoration:none}
    .nav a.esme-tab{background:linear-gradient(90deg,#ff6ec4,#7873f5);color:#fff;
      box-shadow:0 2px 8px rgba(255,110,196,.5)}
    .nav a.esme-tab:hover{background:linear-gradient(90deg,#ff8fd0,#948ff7);filter:brightness(1.05)}

    .wrap{max-width:980px;margin:0 auto;padding:30px 20px 70px}
    h1{font-size:34px;font-weight:900;letter-spacing:-.3px;margin-bottom:6px;color:var(--text-hi)}
    h2{font-size:23px;font-weight:800;margin:26px 0 12px;color:var(--bills-blue)}
    p.sub{color:var(--text-lo);font-size:18px;font-weight:600;margin-bottom:22px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
          padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}

    /* ---- Chunky buttons a kid can't miss ---- */
    .btn{display:inline-block;background:var(--bills-blue);color:#fff;font-weight:800;border:none;
         border-radius:14px;padding:13px 22px;font-size:17px;font-family:inherit;cursor:pointer;
         box-shadow:0 3px 0 var(--bills-blue-dark);transition:transform .1s,box-shadow .1s}
    .btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--bills-blue-dark);text-decoration:none}
    .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bills-blue-dark)}
    .btn.green{background:var(--accent2);box-shadow:0 3px 0 #8E0822}
    .btn.green:hover{box-shadow:0 4px 0 #8E0822}
    .btn.green:active{box-shadow:0 1px 0 #8E0822}
    .btn.ghost{background:#fff;border:2px solid var(--bills-blue);color:var(--bills-blue);
               box-shadow:none;padding:11px 20px}
    .btn.ghost:hover{background:#EDF3FF;transform:none;box-shadow:none}
    .btn.small{padding:8px 16px;font-size:15px;border-radius:11px}

    input,select{width:100%;background:#fff;border:2px solid var(--border-strong);border-radius:12px;
          padding:12px 14px;color:var(--text-hi);font-size:17px;font-family:inherit;margin-bottom:14px}
    input:focus,select:focus{outline:none;border-color:var(--bills-blue);
          box-shadow:0 0 0 3px rgba(0,51,141,.15)}
    select{width:auto}
    label{display:block;font-size:15px;color:var(--text-hi);margin-bottom:6px;font-weight:800}
    .error{background:#FDE8EC;border:2px solid var(--red);color:#8B0A22;font-weight:700;
           padding:12px 14px;border-radius:12px;margin-bottom:16px;font-size:16px}

    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:12px 12px;border-bottom:1px solid var(--border);font-size:17px}
    th{color:var(--text-lo);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
    td{font-weight:600}
    .rank{font-weight:900;font-size:20px;color:var(--bills-blue);width:52px}
    .pts{font-weight:900;color:var(--accent2);text-align:right;font-size:20px}
    .muted{color:var(--text-lo);font-size:15px;font-weight:600}
    .pill{display:inline-block;background:var(--surface2);border:1px solid var(--border-strong);
          border-radius:999px;padding:3px 11px;font-size:13px;color:#1D3A75;font-weight:800}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

    /* ---- Standings leader: golden row ---- */
    .leader{border:2px solid #EAB308!important;box-shadow:0 0 0 3px rgba(234,179,8,.25)}
    tr.leader td{background:var(--gold-bg)}
    tr.leader td:first-child{border-radius:10px 0 0 10px}
    tr.leader td:last-child{border-radius:0 10px 10px 0}

    /* ============================================================
       LIVE vs HISTORICAL badge — loud so nobody mistakes old
       stats for live scores.
       ============================================================ */
    .data-mode-badge{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;
      border-radius:16px;margin:0 0 20px;border-width:3px;border-style:solid;box-shadow:var(--shadow)}
    .data-mode-badge .dm-pill{font-weight:900;font-size:19px;letter-spacing:.03em;padding:9px 20px;
      border-radius:999px;white-space:nowrap;box-shadow:0 2px 6px rgba(16,42,100,.2)}
    .data-mode-badge .dm-note{font-size:16px;font-weight:700;color:var(--text-hi);flex:1;min-width:200px}
    /* Live = green + pulsing */
    .mode-live{border-color:#15803D;background:#E4F8EC}
    .mode-live .dm-pill{background:#15803D;color:#fff;animation:livePulse 1.6s ease-in-out infinite}
    @keyframes livePulse{
      0%,100%{box-shadow:0 0 0 0 rgba(21,128,61,.45)}
      50%{box-shadow:0 0 0 9px rgba(21,128,61,0)}
    }
    /* Upcoming = amber */
    .mode-upcoming{border-color:#B45309;background:#FFF4D6}
    .mode-upcoming .dm-pill{background:#F59E0B;color:#451A03}
    /* Historical = Bills blue "final score book" */
    .mode-historical{border-color:var(--bills-blue);background:#E3EDFF}
    .mode-historical .dm-pill{background:var(--bills-blue);color:#fff}

    @media (max-width:560px){
      html,body{font-size:16px}
      h1{font-size:28px}
      .wrap{padding:20px 14px 50px}
      .card{padding:18px}
      .data-mode-badge .dm-pill{font-size:17px}
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🏈 Hugo's <span>Fantasy League</span></a>
    <div class="spacer"></div>
    {% if user %}
      <a class="link" href="/dashboard">My Leagues</a>
      <a class="link" href="/leaderboard">🏆 Leaderboard</a>
      <a class="link" href="/stats">NFL Stats</a>
      <a class="link esme-tab" href="/esme">🦄 Esme's Page</a>
      <a class="link" href="/logout">Log out ({{ user['username'] }})</a>
    {% else %}
      <a class="link" href="/leaderboard">🏆 Leaderboard</a>
      <a class="link" href="/stats">NFL Stats</a>
      <a class="link esme-tab" href="/esme">🦄 Esme's Page</a>
      <a class="link" href="/login">Log in</a>
      <a class="btn small green" href="/register">Sign up</a>
    {% endif %}
  </nav>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
