services:
  - type: web
    name: hugoes-fantasy
    runtime: python
    rootDir: projects/nfl-stats
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180
    envVars:
      - key: FFL_SECRET
        generateValue: true
